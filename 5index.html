<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guardian Step | Smart Disaster Response System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

/* =====================================
   GUARDIAN STEP FUTURISTIC DESIGN CSS
   ===================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:#020303;
    color:white;
    overflow:hidden;
}

/* Emergency shake */
@keyframes shake{
    0% { transform:translate(0,0); }
    20% { transform:translate(-8px,4px); }
    40% { transform:translate(8px,-5px); }
    60% { transform:translate(-5px,6px); }
    80% { transform:translate(5px,-3px); }
    100% { transform:translate(0,0); }
}

/* HEADER */
header{
    height:90px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 35px;
    background: linear-gradient(90deg,#050505,#101010);
    border-bottom:2px solid #00ff88;
    box-shadow: 0 0 25px #00ff88;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:4px;
    color:#00ff88;
    text-shadow: 0 0 15px #00ff88;
}

.status{
    display:flex;
    gap:10px;
}

.card{
    width:140px;
    height:65px;
    background:#090909;
    border:1px solid #00ff88;
    padding:8px;
    box-shadow: 0 0 10px #00ff8844;
    text-align: center;
}

.card h3{
    font-size:10px;
    color:#8affcc;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.card span{
    font-size:14px;
    color:white;
    font-weight: bold;
}

/* MAIN */
.main{
    display:grid;
    grid-template-columns:280px 1fr;
    height:calc(100vh - 90px);
}

.sidebar{
    background:#050505;
    border-right:2px solid #00ff88;
    padding:20px;
}

.sidebar h2{
    color:#00ff88;
    margin-bottom:15px;
    font-size: 18px;
}

button{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    background:#001f12;
    color:#00ff88;
    border:1px solid #00ff88;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#00ff88;
    color:black;
    box-shadow: 0 0 30px #00ff88;
}

.sos-btn {
    background: #440000 !important;
    color: #ff4444 !important;
    border: 1px solid #ff0000 !important;
    box-shadow: 0 0 15px #ff0000 !important;
    animation: pulse-red 1.5s infinite;
}

@keyframes pulse-red {
    50% { box-shadow: 0 0 30px red; }
}

.logs{
    height:180px;
    overflow:auto;
    border:1px solid #00ff88;
    padding:10px;
    background:#080808;
    font-size: 11px;
}

/* MAP AREA */
.mapArea{ padding:20px; position: relative; }
.title{ font-size:22px; color:#00ff88; margin-bottom:15px; }

.building{
    position:relative;
    width:980px;
    height:550px;
    margin:auto;
    background: #050505;
    border:4px solid #00ff88;
    box-shadow: 0 0 30px #00ff88;
}

.room{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    border:1px solid #444;
    color:#888;
    font-size: 10px;
    text-align: center;
}

.exit{ background:#003b18; color:#00ff88; border-color:#00ff88; font-weight:bold; }

/* EVACUATION PATH (THE GREEN LINE) */
#evacPath {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    visibility: hidden; /* Hidden by default */
}

.path-line {
    fill: none;
    stroke: #00ff88;
    stroke-width: 6;
    stroke-dasharray: 15;
    filter: drop-shadow(0 0 10px #00ff88);
    animation: flow 1s linear infinite;
}

@keyframes flow {
    to { stroke-dashoffset: -30; }
}

.dangerZone{ background:#500000 !important; border-color:red !important; color:white; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.7; } }

</style>
</head>
<body>

<header>
    <div class="logo">GUARDIAN STEP</div>
    <div class="status">
        <div class="card"><h3>Gas Sensor</h3><span id="gasVal">SAFE</span></div>
        <div class="card"><h3>Earthquake</h3><span id="quakeVal">NONE</span></div>
        <div class="card"><h3>Evacuation</h3><span id="evacVal">WAITING</span></div>
        <div class="card"><h3>Emergency</h3><span id="emerVal">IDLE</span></div>
    </div>
</header>

<div class="main">
    <aside class="sidebar">
        <h2>CONTROLS</h2>
        <button onclick="triggerFire()">FIRE ALERT</button>
        <button onclick="triggerGas()">GAS LEAK</button>
        <button onclick="triggerQuake()">QUAKE ALERT</button>
        <button onclick="location.reload()">RESET SYSTEM</button>
        <button class="sos-btn" onclick="triggerSOS()">EMERGENCY SOS</button>

        <h2>LOGS</h2>
        <div class="logs" id="logBox"><p>[SYSTEM INFO] Standing by...</p></div>
    </aside>

    <div class="mapArea">
        <h1 class="title">BUILDING FLOOR MAP</h1>
        <div class="building" id="floorMap">
            
            <!-- Rooms -->
            <div id="lab" class="room" style="width:180px; height:120px; left:20px; top:20px;">LABORATORY</div>
            <div class="room" style="width:140px; height:100px; left:220px; top:20px;">CONTROL ROOM</div>
            <div class="room" style="width:110px; height:80px; left:380px; top:20px;">ROOM A</div>
            <div class="room" style="width:110px; height:80px; left:500px; top:20px;">ROOM B</div>
            <div class="room" style="width:110px; height:80px; left:620px; top:20px;">ROOM C</div>
            
            <div class="room" style="width:40px; height:200px; left:750px; top:20px;">HALLWAY</div>
            <div class="room" style="width:180px; height:100px; left:800px; top:20px;">CONFERENCE HALL</div>

            <div id="storage" class="room" style="width:120px; height:100px; left:20px; top:250px;">STORAGE</div>
            <div class="room" style="width:140px; height:100px; left:160px; top:250px;">ELECTRICAL ROOM</div>
            
            <!-- Exits -->
            <div class="room exit" style="width:100px; height:60px; right:0; top:200px;">EXIT</div>
            <div class="room exit" style="width:180px; height:80px; right:20px; bottom:20px;">MAIN EXIT</div>

            <!-- THE GREEN PATH (SVG) -->
            <svg id="evacPath">
                <!-- Path from Lab to Main Exit -->
                <path class="path-line" d="M 110 140 L 110 200 L 770 200 L 770 480 L 850 480" />
            </svg>

        </div>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;

    function speak(text) {
        if (synth.speaking) { synth.cancel(); }
        const utter = new SpeechSynthesisUtterance(text);
        utter.pitch = 1;
        utter.rate = 0.9;
        synth.speak(utter);
    }

    function addLog(msg, color="#00ff88") {
        const box = document.getElementById('logBox');
        box.innerHTML = `<p style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</p>` + box.innerHTML;
    }

    function showSafetyPath() {
        document.getElementById('evacPath').style.visibility = "visible";
    }

    function triggerFire() {
        document.getElementById('lab').classList.add('dangerZone');
        document.getElementById('emerVal').innerText = "FIRE";
        document.getElementById('evacVal').innerText = "ACTIVE";
        addLog("FIRE IN LABORATORY!", "red");
        showSafetyPath();
        speak("Attention. Fire detected in the Laboratory. Please remain calm and follow the glowing green path to the main exit immediately.");
    }

    function triggerGas() {
        document.getElementById('storage').classList.add('dangerZone');
        document.getElementById('gasVal').innerText = "DANGER";
        addLog("GAS LEAK IN STORAGE", "orange");
        showSafetyPath();
        speak("Warning. Gas leak detected in storage area. Cover your nose and follow the green evacuation route to the nearest exit.");
    }

    function triggerQuake() {
        document.body.style.animation = "shake 0.5s infinite";
        document.getElementById('quakeVal').innerText = "ALERT";
        addLog("EARTHQUAKE DETECTED", "yellow");
        speak("Earthquake detected. Drop, cover, and hold on. Once shaking stops, follow the green path to the main exit.");
    }

    function triggerSOS() {
        document.getElementById('emerVal').innerText = "SOS SENT";
        addLog("SOS SIGNAL BROADCASTED", "red");
        showSafetyPath();
        speak("Emergency SOS activated. Authorities have been notified. Please head to the safe zone by following the green line.");
    }
</script>

</body>
</html>
